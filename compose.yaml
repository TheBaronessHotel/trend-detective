# The local stack. Start it with `make up`. Settings come from .env.
#
# Ports bind to 127.0.0.1 only, so nothing is reachable from your network.
#   4222  NATS clients        8222  NATS monitoring (/jsz?streams=true)
#   6379  Redis
#   8333  SeaweedFS S3        9333  SeaweedFS master UI    8888  filer UI

name: trend-detective

# Connection settings every service needs. A service adds them with
#   environment:
#     <<: *infra-env
x-infra-env: &infra-env
  NATS_URL: nats://nats:4222
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}

services:
  nats:
    image: nats:2.15.3-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:8.8.4-alpine
    # AOF persistence, so job state survives a restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    entrypoint: ["/bin/sh", "/deploy/start.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
      S3_ALLOWED_ORIGINS: ${S3_ALLOWED_ORIGINS:-*}
    ports:
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
      - "127.0.0.1:8888:8888"
    volumes:
      - ./deploy/seaweedfs/start.sh:/deploy/start.sh:ro
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/healthz"]
      interval: 2s
      timeout: 2s
      retries: 60

  # Creates the JetStream streams and the buckets, then exits. Services that
  # use NATS or S3 should wait for it with
  #   depends_on:
  #     bootstrap:
  #       condition: service_completed_successfully
  bootstrap:
    build:
      context: .
      dockerfile: deploy/bootstrap/Dockerfile
    environment:
      <<: *infra-env
    depends_on:
      nats:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    restart: "no"

  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    environment:
      <<: *infra-env
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}
      HARMONY_CONCURRENCY: ${HARMONY_CONCURRENCY:-4}
      # The same limit as the gateway's, checked again when reading.
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      BUNDLE_DIR: /bundle
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./services/ingest/bundle:/bundle:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  preprocess:
    build:
      context: .
      dockerfile: services/preprocess/Dockerfile
    environment:
      <<: *infra-env
      PREPROCESS_CONCURRENCY: ${PREPROCESS_CONCURRENCY:-2}
      PREPROCESS_ACK_WAIT: ${PREPROCESS_ACK_WAIT:-2m}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  # The public Connect API, on http://localhost:8080.
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      <<: *infra-env
      HTTP_ADDR: ":8080"
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      PRESIGN_TTL: ${PRESIGN_TTL:-15m}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      SUBREGION_N: ${SUBREGION_N:-8}
      MAX_GRID: ${MAX_GRID:-128}
      MAX_GRANULES: ${MAX_GRANULES:-1000}
      TASK_CAP: ${TASK_CAP:-256}
      QUOTA_CUTOFF: ${QUOTA_CUTOFF:-0.9}
      EARTHDATA_TOKEN: ${EARTHDATA_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/gateway", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  nats-data:
  redis-data:
  seaweedfs-data:
