# The variable catalog. The gateway checks it at startup and fills in each
# job's defaults from it, so the stages never read it themselves.
#
# Fields of each entry:
#   id               stable ID, used in jobs and cache keys
#   name             shown in the app
#   topic            the browser's topic, one of Topics in internal/catalog
#   measurement      the measurement within the topic, also from Topics
#   product          the data product, like MERRA-2 or MODIS, for search and citing
#   definition       one or two plain sentences for a high-school student
#   units            display units, after the filter chain
#   step             daily, weekly or monthly
#   available        dates the product covers, YYYY-MM-DD
#   grid             false for series-only sources, which hide the slider and heatmap
#   pixel_size       for grid variables, the native pixel size in degrees, {lat, lon}
#   domain           land, ocean or global
#   default_source   one of the keys under sources
#   sources          settings per adapter. Each one is that adapter's message in
#                    ingest.v1 (HarmonySubset, Power, Bundle and so on).
#                    giovanni-point, where offered, is a quick second source:
#                    the series at the rectangle's center, in a few seconds
#   source_units     units of the raw values, for files that don't say
#   filters          the default preprocess.v1.FilterChain
#   aggregation      optional preprocess.v1.Aggregation; block_pixels sets the grid's
#                    default cell size. A job's settings go on top, field by field,
#                    and unset ones use SUBREGION_N, MAX_GRID and 0.5 coverage
#   tests            the default analysis.v1.TestPlan
#   llm_hints        extra context for the narrator
#   dataset_url      the product's page, for citations
#
# sources, filters, aggregation and tests use protojson field and enum names.

variables:
  - id: air-temperature-power
    name: Air temperature (one point)
    topic: Air
    measurement: Temperature
    product: POWER
    definition: >-
      How warm the air is 2 meters above the ground, averaged over each month.
      It comes from NASA's POWER project, which combines satellite data with
      weather models.
    units: °C
    step: monthly
    available: { start: 1981-01-01, end: 2025-12-31 }
    grid: false
    domain: land
    # power samples the middle of any rectangle. bundle is a copy for one
    # point in Delhi, 1981 to 2024, for offline demos.
    default_source: power
    sources:
      power: { parameters: [T2M], community: AG }
      bundle: { name: power-delhi-monthly, variables: [T2M] }
    source_units: °C
    filters:
      ops:
        - qc_range: { min: -90, max: 60 }
        - anomaly: { kind: ANOMALY_KIND_ABSOLUTE }
        - gap_fill_display: { max_gap: 2 }
    tests: &series-tests
      alpha: 0.05
      series:
        - regression: { correct_autocorrelation: true }
        - mann_kendall: { variant: MANN_KENDALL_VARIANT_HAMED_RAO }
        - pettitt: {}
        - residual_checks: {}
        - outliers: { robust_z_threshold: 3.5 }
        - shuffle: { permutations: 1000, block_length: 12 }
        - trend_triangle: { min_years: 10 }
        - monthly_trends: {}
        - years_to_significance: {}
    llm_hints: >-
      POWER values at a point come from a roughly 50 km model grid cell, not a
      weather station.
    dataset_url: https://power.larc.nasa.gov/

  - id: precipitation-gpm
    name: Rain and snow (satellites)
    topic: Air
    measurement: Rain and snow
    product: GPM IMERG
    definition: >-
      How much rain and snow falls, in millimeters per day, averaged over each
      month. It comes from GPM IMERG, which merges measurements from a fleet
      of satellites with rain gauges on the ground.
    units: mm/day
    step: monthly
    available: { start: 1998-01-01, end: 2025-09-30 }
    grid: true
    pixel_size: { lat: 0.1, lon: 0.1 }
    domain: global
    default_source: harmony-subset
    sources:
      harmony-subset:
        collection_id: C2723754851-GES_DISC
        variables: [Grid/precipitation]
      giovanni-point: { data_field_id: GPM_3IMERGM_07_precipitation }
    source_units: mm/hr
    # Grid cells of 4x4 native pixels: IMERG pixels are 0.1°, about 10 km, and noisy. See Decisions > Region model.
    aggregation: { block_pixels: 4 }
    filters:
      ops:
        - qc_range: { min: 0, max: 100 }
        - linear: { scale: 24, offset: 0, units: mm/day }
        - anomaly: { kind: ANOMALY_KIND_PERCENT }
        - gap_fill_display: { max_gap: 2 }
    tests: &grid-tests
      <<: *series-tests
      grid:
        - regression: { correct_autocorrelation: true }
        - mann_kendall: { variant: MANN_KENDALL_VARIANT_HAMED_RAO }
      fdr_q: 0.05
    llm_hints: >-
      IMERG is a 0.1 degree grid, about 10 km. Over land, rain gauges correct
      the satellite estimate. Monthly totals are much more reliable than any
      single day.
    dataset_url: https://disc.gsfc.nasa.gov/datasets/GPM_3IMERGM_07/summary

  # The record ends move as NASA adds months. Preflight clamps requests to
  # them, so bump them now and then.
  - id: air-temperature-merra2
    name: Air temperature (map)
    topic: Air
    measurement: Temperature
    product: MERRA-2
    definition: >-
      How warm the air is 2 meters above the ground, averaged over each month.
      It comes from MERRA-2, NASA's reanalysis, which blends satellite and
      weather-station measurements into a weather model to cover the whole
      globe.
    units: °C
    step: monthly
    available: { start: 1980-01-01, end: 2026-09-30 }
    grid: true
    pixel_size: { lat: 0.5, lon: 0.625 }
    domain: global
    default_source: harmony-subset
    sources:
      harmony-subset:
        collection_id: C1276812859-GES_DISC
        variables: [T2M]
    source_units: K
    # Grid cells of 1x1 native pixels: MERRA-2 pixels are already 0.5° by 0.625°. See Decisions > Region model.
    aggregation: { block_pixels: 1 }
    filters:
      ops:
        - qc_range: { min: 150, max: 350 }
        - linear: { scale: 1, offset: -273.15, units: °C }
        - anomaly: { kind: ANOMALY_KIND_ABSOLUTE }
        - gap_fill_display: { max_gap: 2 }
    tests: *grid-tests
    llm_hints: >-
      MERRA-2 is a model reanalysis on a 0.5 by 0.625 degree grid, about 50 km.
      It has no gaps, but changes in what satellites were flying can add small
      jumps, so a step change can come from the data rather than the climate.
    dataset_url: https://disc.gsfc.nasa.gov/datasets/M2TMNXSLV_5.12.4/summary

  - id: soil-moisture-gldas
    name: Soil moisture, top 10 cm (map)
    topic: Water
    measurement: Soil moisture
    product: GLDAS
    definition: >-
      How much water is in the top 10 centimeters of soil, averaged over each
      month. One kilogram per square meter equals a 1 mm layer of water. It
      comes from GLDAS, a NASA land model driven by satellite and ground
      measurements.
    units: kg/m²
    step: monthly
    available: { start: 2000-01-01, end: 2026-07-31 }
    grid: true
    pixel_size: { lat: 0.25, lon: 0.25 }
    domain: land
    default_source: harmony-subset
    sources:
      harmony-subset:
        collection_id: C1342986036-GES_DISC
        variables: [SoilMoi0_10cm_inst]
      giovanni-point: { data_field_id: GLDAS_NOAH025_M_2_1_SoilMoi0_10cm_inst }
    source_units: kg/m²
    # Grid cells of 2x2 native pixels: GLDAS pixels are 0.25°. See Decisions > Region model.
    aggregation: { block_pixels: 2 }
    filters:
      ops:
        - qc_range: { min: 0, max: 100 }
        - anomaly: { kind: ANOMALY_KIND_ABSOLUTE }
        - gap_fill_display: { max_gap: 2 }
    tests: *grid-tests
    llm_hints: >-
      GLDAS is a model, not a direct measurement. Over deserts and ice the top
      layer barely changes, so a trend there means little. Ocean pixels are
      empty.
    dataset_url: https://disc.gsfc.nasa.gov/datasets/GLDAS_NOAH025_M_2.1/summary

  - id: snow-gldas
    name: Snow water (map)
    topic: Snow and ice
    measurement: Snow
    product: GLDAS
    definition: >-
      How much water is stored in the snow on the ground, as the depth of
      water you'd get if it all melted, averaged over each month. One kilogram
      per square meter equals a 1 mm layer of water. It comes from GLDAS, a
      NASA land model driven by satellite and ground measurements.
    units: kg/m²
    step: monthly
    available: { start: 2000-01-01, end: 2026-07-31 }
    grid: true
    pixel_size: { lat: 0.25, lon: 0.25 }
    domain: land
    default_source: harmony-subset
    sources:
      harmony-subset:
        collection_id: C1342986036-GES_DISC
        variables: [SWE_inst]
      giovanni-point: { data_field_id: GLDAS_NOAH025_M_2_1_SWE_inst }
    source_units: kg/m²
    # Grid cells of 2x2 native pixels: GLDAS pixels are 0.25°. See Decisions > Region model.
    aggregation: { block_pixels: 2 }
    filters:
      ops:
        - qc_range: { min: 0, max: 20000 }
        - anomaly: { kind: ANOMALY_KIND_ABSOLUTE }
        - gap_fill_display: { max_gap: 2 }
    tests: *grid-tests
    llm_hints: >-
      Most places have no snow in summer, so the winter and spring months
      carry the signal, and the trend for each calendar month says more than
      the overall one. GLDAS builds its snowpack from the weather it is fed
      rather than measuring snow, so mountain snow is the least certain.
      Glaciers and ice sheets aren't modeled well.
    dataset_url: https://disc.gsfc.nasa.gov/datasets/GLDAS_NOAH025_M_2.1/summary

  - id: ozone-merra2
    name: Ozone layer (map)
    topic: Air quality
    measurement: Gases
    product: MERRA-2
    definition: >-
      How much ozone is in the air above the ground, averaged over each month.
      Most of it is in the ozone layer, 15 to 35 km up, which blocks harmful
      ultraviolet light from the Sun. If all of it were squeezed down to
      ground pressure, 100 Dobson units would be a layer 1 mm thick. It comes
      from MERRA-2, NASA's reanalysis, which takes in satellite measurements
      of ozone.
    units: DU
    step: monthly
    available: { start: 1980-01-01, end: 2026-09-30 }
    grid: true
    pixel_size: { lat: 0.5, lon: 0.625 }
    domain: global
    default_source: harmony-subset
    sources:
      harmony-subset:
        collection_id: C1276812859-GES_DISC
        variables: [TO3]
    source_units: DU
    # Grid cells of 1x1 native pixels: MERRA-2 pixels are already 0.5° by 0.625°. See Decisions > Region model.
    aggregation: { block_pixels: 1 }
    filters:
      ops:
        - qc_range: { min: 50, max: 700 }
        - anomaly: { kind: ANOMALY_KIND_ABSOLUTE }
        - gap_fill_display: { max_gap: 2 }
    tests: *grid-tests
    llm_hints: >-
      The Antarctic ozone hole opens each September and October, so the trend
      for those calendar months matters most there. The 1987 Montreal Protocol
      banned the chemicals that destroy ozone, and the layer recovers slowly,
      so trends since 2000 are small next to the swings from year to year.
      MERRA-2 took in SBUV ozone until September 2004 and OMI and MLS after,
      so a step change in 2004 can come from the data.
    dataset_url: https://disc.gsfc.nasa.gov/datasets/M2TMNXSLV_5.12.4/summary

  - id: aerosol-merra2
    name: Haze from particles (map)
    topic: Air quality
    measurement: Particles
    product: MERRA-2
    definition: >-
      How much sunlight is blocked by tiny particles in the air, such as dust,
      smoke, sea salt and pollution, averaged over each month. Scientists call
      it aerosol optical depth, or AOD. Below 0.1 is clear air, and above 1 is
      thick haze. It comes from MERRA-2, NASA's reanalysis, which takes in
      satellite measurements of aerosols.
    units: AOD
    step: monthly
    available: { start: 1980-01-01, end: 2026-09-30 }
    grid: true
    pixel_size: { lat: 0.5, lon: 0.625 }
    domain: global
    default_source: harmony-subset
    sources:
      harmony-subset:
        collection_id: C1276812866-GES_DISC
        variables: [TOTEXTTAU]
    source_units: AOD
    # Grid cells of 1x1 native pixels: MERRA-2 pixels are already 0.5° by 0.625°. See Decisions > Region model.
    aggregation: { block_pixels: 1 }
    filters:
      ops:
        - qc_range: { min: 0, max: 10 }
        - anomaly: { kind: ANOMALY_KIND_ABSOLUTE }
        - gap_fill_display: { max_gap: 2 }
    tests: *grid-tests
    llm_hints: >-
      MERRA-2 takes in MODIS aerosol measurements from 2000 on. Before that it
      had much less to go on, so a trend that starts before 2000 partly
      reflects the change in inputs. Dust storms, wildfire smoke and volcanic
      eruptions make single months spike, so outlier months are common.
      Pollution controls, as in China after 2013, can show up as a change
      point.
    dataset_url: https://disc.gsfc.nasa.gov/datasets/M2TMNXAER_5.12.4/summary

  # Area averages from Giovanni, through Harmony. These are series for the
  # whole rectangle, with no map, because the daily records have thousands of
  # files. Giovanni wants its own variable ID, from
  # api.giovanni.earthdata.nasa.gov/configured-variables/.
  - id: no2-omi
    name: Air pollution, NO2 (area average)
    topic: Air quality
    measurement: Gases
    product: OMI
    definition: >-
      How much nitrogen dioxide is in the lowest layer of the atmosphere,
      averaged over the rectangle and over each month. Most of it comes from
      car engines, power plants and factories. The OMI instrument on NASA's
      Aura satellite measures it on days that aren't too cloudy.
    units: 10¹⁵ molecules/cm²
    step: monthly
    available: { start: 2004-10-01, end: 2026-09-30 }
    grid: false
    domain: global
    default_source: giovanni-area
    sources:
      giovanni-area:
        data_field_id: OMNO2d_003_ColumnAmountNO2TropCloudScreened
        collection_id: C1266136111-GES_DISC
      giovanni-point: { data_field_id: OMNO2d_003_ColumnAmountNO2TropCloudScreened }
    source_units: molecules/cm²
    filters:
      ops:
        - qc_range: { min: -1.0e16, max: 1.0e18 }
        - linear: { scale: 1.0e-15, offset: 0, units: 10¹⁵ molecules/cm² }
        # The data is daily, and cloudy days are missing.
        - monthly_mean: { min_valid_days: 10 }
        - anomaly: { kind: ANOMALY_KIND_PERCENT }
        - gap_fill_display: { max_gap: 2 }
    tests: *series-tests
    llm_hints: >-
      OMI only sees through gaps in the clouds, so cloudy months rest on fewer
      days. NO2 lasts only hours in the air, so it stays close to where it is
      emitted, and changes in traffic, industry or emission rules show up
      directly.
    dataset_url: https://disc.gsfc.nasa.gov/datasets/OMNO2d_003/summary

  - id: groundwater-gldas
    name: Groundwater (area average)
    topic: Water
    measurement: Groundwater
    product: GLDAS
    definition: >-
      How much water is stored underground, in millimeters of water, averaged
      over the rectangle and over each month. It comes from a NASA land model
      that is corrected with the GRACE satellites, which measure tiny changes
      in Earth's gravity caused by water moving underground.
    units: mm
    step: monthly
    available: { start: 2003-02-01, end: 2026-09-30 }
    grid: false
    domain: land
    default_source: giovanni-area
    sources:
      giovanni-area:
        data_field_id: GLDAS_CLSM025_DA1_D_2_2_GWS_tavg
        collection_id: C1700900796-GES_DISC
      giovanni-point: { data_field_id: GLDAS_CLSM025_DA1_D_2_2_GWS_tavg }
    source_units: mm
    filters:
      ops:
        - qc_range: { min: 0, max: 10000 }
        # The data is daily.
        - monthly_mean: { min_valid_days: 20 }
        - anomaly: { kind: ANOMALY_KIND_ABSOLUTE }
        - gap_fill_display: { max_gap: 2 }
    tests: *series-tests
    llm_hints: >-
      This is model output corrected by GRACE, not a direct measurement.
      GRACE only resolves features a few hundred kilometers across, so small
      rectangles mostly reflect the model. Heavy pumping for irrigation, as
      in northwest India, shows up as a steady decline.
    dataset_url: https://disc.gsfc.nasa.gov/datasets/GLDAS_CLSM025_DA1_D_2.2/summary

  - id: co2-oco2
    name: Carbon dioxide, CO2 (area average)
    topic: Air quality
    measurement: Gases
    product: OCO-2
    definition: >-
      How much carbon dioxide is in the air, in parts per million: out of every
      million molecules of dry air, from the ground to the top of the
      atmosphere, how many are CO2. Averaged over the rectangle and over each
      month. It comes from NASA's OCO-2 satellite, with a weather model
      filling the gaps between its paths.
    units: ppm
    step: monthly
    # Each day is stamped at noon, and Giovanni's averaging refuses a start
    # before 2015-01-01T12:00, so the range starts the day after.
    available: { start: 2015-01-02, end: 2022-02-28 }
    grid: false
    domain: global
    default_source: giovanni-area
    sources:
      giovanni-area:
        data_field_id: OCO2_GEOS_L3CO2_DAY_10r_XCO2
        collection_id: C2240248762-GES_DISC
      giovanni-point: { data_field_id: OCO2_GEOS_L3CO2_DAY_10r_XCO2 }
    source_units: mol/mol
    filters:
      ops:
        - qc_range: { min: 3.0e-4, max: 5.0e-4 }
        - linear: { scale: 1.0e+6, offset: 0, units: ppm }
        # The data is daily, with no gaps.
        - monthly_mean: { min_valid_days: 20 }
        - anomaly: { kind: ANOMALY_KIND_ABSOLUTE }
        - gap_fill_display: { max_gap: 2 }
    # The record is about seven years, so the trend triangle starts at three.
    tests:
      alpha: 0.05
      series:
        - regression: { correct_autocorrelation: true }
        - mann_kendall: { variant: MANN_KENDALL_VARIANT_HAMED_RAO }
        - pettitt: {}
        - residual_checks: {}
        - outliers: { robust_z_threshold: 3.5 }
        - shuffle: { permutations: 1000, block_length: 12 }
        - trend_triangle: { min_years: 3 }
        - monthly_trends: {}
        - years_to_significance: {}
    llm_hints: >-
      CO2 mixes through the whole atmosphere within about a year, so every
      region shows nearly the same steady rise, with a yearly cycle on top
      from plants growing and decaying, strongest in the Northern Hemisphere.
      The rise is so steady that it is significant after only a few years,
      unlike rain or temperature. This version of the record ends in February
      2022.
    dataset_url: https://disc.gsfc.nasa.gov/datasets/OCO2_GEOS_L3CO2_DAY_10r/summary

  - id: chlorophyll-nobm
    name: Ocean chlorophyll (map)
    topic: Ocean
    measurement: Ocean colour
    product: NOBM
    definition: >-
      How much chlorophyll is in the sea's surface water, averaged over each
      month. Chlorophyll is the green pigment in
      phytoplankton, the tiny plants at the base of the ocean food web, so
      more chlorophyll means more of them. It comes from NASA's Ocean
      Biogeochemical Model, which takes in chlorophyll measured from space.
      Values are shown as log10, because they range from very low in the open
      ocean to very high near coasts.
    units: log₁₀(mg/m³)
    step: monthly
    available: { start: 1998-01-01, end: 2015-12-31 }
    grid: true
    pixel_size: { lat: 0.667, lon: 1.25 }
    domain: ocean
    default_source: harmony-subset
    sources:
      # NOBM's monthly files, for the map. Harmony's subsetter can't read
      # their time units ("months since 1998"), so ingest names the files by
      # granule ID instead of asking for a time subset.
      harmony-subset:
        collection_id: C1404080681-GES_DISC
        variables: [tot]
        by_granule_id: true
      giovanni-area:
        data_field_id: NOBM_DAY_R2017_tot
        collection_id: C1404080675-GES_DISC
      giovanni-point: { data_field_id: NOBM_DAY_R2017_tot }
    source_units: mg/m³
    # Grid cells of 1x1 native pixels: NOBM pixels are already 2/3° by 1.25°.
    aggregation: { block_pixels: 1 }
    filters:
      ops:
        - qc_range: { min: 0.001, max: 100 }
        # Giovanni's average is daily, with no gaps outside sea ice; the map's
        # files are monthly already.
        - monthly_mean: { min_valid_days: 20 }
        - log10: {}
        - anomaly: { kind: ANOMALY_KIND_ABSOLUTE }
        - gap_fill_display: { max_gap: 2 }
    tests: *grid-tests
    llm_hints: >-
      This is model output that takes in satellite chlorophyll from SeaWiFS
      and MODIS, on a grid about 100 km across, so narrow coastal waters and
      river plumes are blurred. Trends are on log10 values, so they describe
      changes in percent rather than in mg/m³. The record ends in 2015.
      Land pixels are empty.
    dataset_url: https://disc.gsfc.nasa.gov/datasets/NOBM_DAY_R2017/summary

  - id: precipitation-power
    name: Rain and snow (one point)
    topic: Air
    measurement: Rain and snow
    product: POWER
    definition: >-
      How much rain and snow falls, in millimeters per day, averaged over each
      month. It comes from NASA's POWER project, which combines satellite data
      with weather models.
    units: mm/day
    step: monthly
    available: { start: 1981-01-01, end: 2025-12-31 }
    grid: false
    domain: land
    default_source: power
    sources:
      power: { parameters: [PRECTOTCORR], community: AG }
      bundle: { name: power-delhi-monthly, variables: [PRECTOTCORR] }
    source_units: mm/day
    filters:
      ops:
        - qc_range: { min: 0, max: 1000 }
        - anomaly: { kind: ANOMALY_KIND_PERCENT }
        - gap_fill_display: { max_gap: 2 }
    tests: *series-tests
    llm_hints: >-
      Delhi gets most of its rain in the June to September monsoon, so
      year-to-year noise is large and trends need a long record.
    dataset_url: https://power.larc.nasa.gov/

  # A CSV the user uploads through CreateUploadURL. Ingest checks it, stores
  # a cleaned-up copy with a date and a value column, and finds the time step
  # from the dates. The step below is only a placeholder: RawDataset.step has
  # the real one.
  # NASA AppEEARS averages 1 km MODIS images over the rectangle. It takes
  # requests in turn, so a job takes a few minutes, longer when it's busy.
  # It logs in with EARTHDATA_USERNAME and EARTHDATA_PASSWORD.
  - id: vegetation-modis
    name: Plant greenness, NDVI (area average)
    topic: Land and plants
    measurement: Plants
    product: MODIS
    definition: >-
      How green and dense the plants are, from bare ground near 0 to thick
      forest near 0.9, averaged over the rectangle for each month. It comes
      from the MODIS instrument on NASA's Terra satellite, which compares the
      red light that leaves absorb with the near-infrared light they reflect.
    units: NDVI
    step: monthly
    available: { start: 2000-02-01, end: 2026-09-30 }
    grid: false
    domain: land
    default_source: appeears
    sources:
      appeears: { product: MOD13A3.061, layers: [_1_km_monthly_NDVI] }
    filters:
      ops:
        - qc_range: { min: -0.2, max: 1 }
        # AppEEARS already scales the values. This only names the units,
        # which a CSV doesn't carry.
        - linear: { scale: 1, offset: 0, units: NDVI }
        - anomaly: { kind: ANOMALY_KIND_ABSOLUTE }
        - gap_fill_display: { max_gap: 2 }
    tests: *series-tests
    llm_hints: >-
      NDVI follows the seasons: crops green up and are harvested, and forests
      leaf out and drop their leaves. A trend in it can mean irrigation, new
      farmland, forest loss or regrowth, or a drying climate. Values near 0
      are bare soil, rock, snow or water.
    dataset_url: https://lpdaac.usgs.gov/products/mod13a3v061/

  - id: land-surface-temperature-modis
    name: Ground temperature, daytime (area average)
    topic: Land and plants
    measurement: Land temperature
    product: MODIS
    definition: >-
      How hot the ground itself gets in the daytime, around half past ten in
      the morning when the Terra satellite passes over, averaged over the
      rectangle and over each month. Bare soil and cities heat up far more
      than the air above them, while forests and water stay cooler.
    units: °C
    step: monthly
    available: { start: 2000-02-18, end: 2026-10-31 }
    grid: false
    domain: land
    default_source: appeears
    sources:
      appeears: { product: MOD11A2.061, layers: [LST_Day_1km] }
    source_units: K
    filters:
      ops:
        - qc_range: { min: 200, max: 360 }
        - linear: { scale: 1, offset: -273.15, units: °C }
        # 8-day composites, about four a month, each counted as 7 days, so
        # 14 asks for at least two of them. Clouds blank some.
