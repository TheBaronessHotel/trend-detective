# The variable catalog. The gateway checks it at startup and fills in each
# job's defaults from it, so the stages never read it themselves.
#
# Fields of each entry:
#   id               stable ID, used in jobs and cache keys
#   name             shown in the app
#   definition       one or two plain sentences for a high-school student
#   units            display units, after the filter chain
#   step             daily, weekly or monthly
#   available        dates the product covers, YYYY-MM-DD
#   grid             false for series-only sources, which hide the slider and heatmap
#   domain           land, ocean or global
#   default_source   one of the keys under sources
#   sources          settings per adapter. Each one is that adapter's message in
#                    ingest.v1 (HarmonySubset, Power, Bundle and so on)
#   source_units     units of the raw values, for files that don't say
#   filters          the default preprocess.v1.FilterChain
#   aggregation      optional preprocess.v1.Aggregation. Unset uses SUBREGION_N and MAX_GRID
#   tests            the default analysis.v1.TestPlan
#   llm_hints        extra context for the narrator
#   dataset_url      the product's page, for citations
#
# sources, filters, aggregation and tests use protojson field and enum names.

variables:
  - id: air-temperature-power
    name: Air temperature (one point)
    definition: >-
      How warm the air is 2 meters above the ground, averaged over each month.
      It comes from NASA's POWER project, which combines satellite data with
      weather models.
    units: °C
    step: monthly
    available: { start: 1981-01-01, end: 2025-12-31 }
    grid: false
    domain: land
    # power samples the middle of any rectangle. bundle is a copy for one
    # point in Delhi, 1981 to 2024, for offline demos.
    default_source: power
    sources:
      power: { parameters: [T2M], community: AG }
      bundle: { name: power-delhi-monthly, variables: [T2M] }
    source_units: °C
    filters:
      ops:
        - qc_range: { min: -90, max: 60 }
        - anomaly: { kind: ANOMALY_KIND_ABSOLUTE }
        - gap_fill_display: { max_gap: 2 }
    tests: &series-tests
      alpha: 0.05
      series:
        - regression: { correct_autocorrelation: true }
        - mann_kendall: { variant: MANN_KENDALL_VARIANT_HAMED_RAO }
        - pettitt: {}
        - residual_checks: {}
        - outliers: { robust_z_threshold: 3.5 }
        - shuffle: { permutations: 1000, block_length: 12 }
        - trend_triangle: { min_years: 10 }
        - monthly_trends: {}
        - years_to_significance: {}
    llm_hints: >-
      POWER values at a point come from a roughly 50 km model grid cell, not a
      weather station.
    dataset_url: https://power.larc.nasa.gov/

  - id: precipitation-gpm
    name: Rain and snow (satellites)
    definition: >-
      How much rain and snow falls, in millimeters per day, averaged over each
      month. It comes from GPM IMERG, which merges measurements from a fleet
      of satellites with rain gauges on the ground.
    units: mm/day
    step: monthly
    available: { start: 1998-01-01, end: 2025-09-30 }
    grid: true
    domain: global
    default_source: harmony-subset
    sources:
      harmony-subset:
        collection_id: C2723754851-GES_DISC
        variables: [Grid/precipitation]
    source_units: mm/hr
    filters:
      ops:
        - qc_range: { min: 0, max: 100 }
        - linear: { scale: 24, offset: 0, units: mm/day }
        - anomaly: { kind: ANOMALY_KIND_PERCENT }
        - gap_fill_display: { max_gap: 2 }
    tests: &grid-tests
      <<: *series-tests
      grid:
        - regression: { correct_autocorrelation: true }
        - mann_kendall: { variant: MANN_KENDALL_VARIANT_HAMED_RAO }
      fdr_q: 0.05
    llm_hints: >-
      IMERG is a 0.1 degree grid, about 10 km. Over land, rain gauges correct
      the satellite estimate. Monthly totals are much more reliable than any
      single day.
    dataset_url: https://disc.gsfc.nasa.gov/datasets/GPM_3IMERGM_07/summary

  # The record ends move as NASA adds months. Preflight clamps requests to
  # them, so bump them now and then.
  - id: air-temperature-merra2
    name: Air temperature (map)
    definition: >-
      How warm the air is 2 meters above the ground, averaged over each month.
      It comes from MERRA-2, NASA's reanalysis, which blends satellite and
      weather-station measurements into a weather model to cover the whole
      globe.
    units: °C
    step: monthly
    available: { start: 1980-01-01, end: 2026-09-30 }
    grid: true
    domain: global
    default_source: harmony-subset
    sources:
      harmony-subset:
        collection_id: C1276812859-GES_DISC
        variables: [T2M]
    source_units: K
    filters:
      ops:
        - qc_range: { min: 150, max: 350 }
        - linear: { scale: 1, offset: -273.15, units: °C }
        - anomaly: { kind: ANOMALY_KIND_ABSOLUTE }
        - gap_fill_display: { max_gap: 2 }
    tests: *grid-tests
    llm_hints: >-
      MERRA-2 is a model reanalysis on a 0.5 by 0.625 degree grid, about 50 km.
      It has no gaps, but changes in what satellites were flying can add small
      jumps, so a step change can come from the data rather than the climate.
    dataset_url: https://disc.gsfc.nasa.gov/datasets/M2TMNXSLV_5.12.4/summary

  - id: soil-moisture-gldas
    name: Soil moisture, top 10 cm (map)
    definition: >-
      How much water is in the top 10 centimeters of soil, averaged over each
      month. One kilogram per square meter equals a 1 mm layer of water. It
      comes from GLDAS, a NASA land model driven by satellite and ground
      measurements.
    units: kg/m²
    step: monthly
    available: { start: 2000-01-01, end: 2026-07-31 }
    grid: true
    domain: land
    default_source: harmony-subset
    sources:
      harmony-subset:
        collection_id: C1342986036-GES_DISC
        variables: [SoilMoi0_10cm_inst]
    source_units: kg/m²
    filters:
      ops:
        - qc_range: { min: 0, max: 100 }
        - anomaly: { kind: ANOMALY_KIND_ABSOLUTE }
        - gap_fill_display: { max_gap: 2 }
    tests: *grid-tests
    llm_hints: >-
      GLDAS is a model, not a direct measurement. Over deserts and ice the top
      layer barely changes, so a trend there means little. Ocean pixels are
      empty.
    dataset_url: https://disc.gsfc.nasa.gov/datasets/GLDAS_NOAH025_M_2.1/summary

  # Area averages from Giovanni, through Harmony. These are series for the
  # whole rectangle, with no map, because the daily records have thousands of
  # files. Giovanni wants its own variable ID, from
  # api.giovanni.earthdata.nasa.gov/configured-variables/.
  - id: no2-omi
    name: Air pollution, NO2 (area average)
    definition: >-
      How much nitrogen dioxide is in the lowest layer of the atmosphere,
      averaged over the rectangle and over each month. Most of it comes from
      car engines, power plants and factories. The OMI instrument on NASA's
      Aura satellite measures it on days that aren't too cloudy.
    units: 10¹⁵ molecules/cm²
    step: monthly
    available: { start: 2004-10-01, end: 2026-09-30 }
    grid: false
    domain: global
    default_source: giovanni-area
    sources:
      giovanni-area:
        data_field_id: OMNO2d_003_ColumnAmountNO2TropCloudScreened
        collection_id: C1266136111-GES_DISC
    source_units: molecules/cm²
    filters:
      ops:
        - qc_range: { min: -1.0e16, max: 1.0e18 }
        - linear: { scale: 1.0e-15, offset: 0, units: 10¹⁵ molecules/cm² }
        # The data is daily, and cloudy days are missing.
        - monthly_mean: { min_valid_days: 10 }
        - anomaly: { kind: ANOMALY_KIND_PERCENT }
        - gap_fill_display: { max_gap: 2 }
    tests: *series-tests
    llm_hints: >-
      OMI only sees through gaps in the clouds, so cloudy months rest on fewer
      days. NO2 lasts only hours in the air, so it stays close to where it is
      emitted, and changes in traffic, industry or emission rules show up
      directly.
    dataset_url: https://disc.gsfc.nasa.gov/datasets/OMNO2d_003/summary

  - id: groundwater-gldas
    name: Groundwater (area average)
    definition: >-
      How much water is stored underground, in millimeters of water, averaged
      over the rectangle and over each month. It comes from a NASA land model
      that is corrected with the GRACE satellites, which measure tiny changes
      in Earth's gravity caused by water moving underground.
    units: mm
    step: monthly
    available: { start: 2003-02-01, end: 2026-09-30 }
    grid: false
    domain: land
    default_source: giovanni-area
    sources:
      giovanni-area:
        data_field_id: GLDAS_CLSM025_DA1_D_2_2_GWS_tavg
        collection_id: C1700900796-GES_DISC
    source_units: mm
    filters:
      ops:
        - qc_range: { min: 0, max: 10000 }
        # The data is daily.
        - monthly_mean: { min_valid_days: 20 }
        - anomaly: { kind: ANOMALY_KIND_ABSOLUTE }
        - gap_fill_display: { max_gap: 2 }
    tests: *series-tests
    llm_hints: >-
      This is model output corrected by GRACE, not a direct measurement.
      GRACE only resolves features a few hundred kilometers across, so small
      rectangles mostly reflect the model. Heavy pumping for irrigation, as
      in northwest India, shows up as a steady decline.
    dataset_url: https://disc.gsfc.nasa.gov/datasets/GLDAS_CLSM025_DA1_D_2.2/summary

  - id: precipitation-power
    name: Rain and snow (one point)
    definition: >-
      How much rain and snow falls, in millimeters per day, averaged over each
      month. It comes from NASA's POWER project, which combines satellite data
      with weather models.
    units: mm/day
    step: monthly
    available: { start: 1981-01-01, end: 2025-12-31 }
    grid: false
    domain: land
    default_source: power
    sources:
      power: { parameters: [PRECTOTCORR], community: AG }
      bundle: { name: power-delhi-monthly, variables: [PRECTOTCORR] }
    source_units: mm/day
    filters:
      ops:
        - qc_range: { min: 0, max: 1000 }
        - anomaly: { kind: ANOMALY_KIND_PERCENT }
        - gap_fill_display: { max_gap: 2 }
    tests: *series-tests
    llm_hints: >-
      Delhi gets most of its rain in the June to September monsoon, so
      year-to-year noise is large and trends need a long record.
    dataset_url: https://power.larc.nasa.gov/
