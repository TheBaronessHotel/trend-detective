server {
    listen 80;
    root /usr/share/nginx/html;

    # Vite names built assets by their hash, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
