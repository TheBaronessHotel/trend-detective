[project]
name = "trenddetective-analysis"
version = "0.1.0"
description = "Runs the trend tests on prepared series for Trend Detective."
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.40",
    "nats-py>=2.11",
    "numpy>=2.3",
    # Must match the version gen/python was generated for, see the
    # ValidateProtobufRuntimeVersion call in any *_pb2.py.
    "protobuf>=7.36.2,<8",
    "scipy>=1.16",
]

[dependency-groups]
# pymannkendall is a reference only: the tests check our Mann-Kendall code
# against it. The service doesn't import it.
dev = ["pymannkendall>=1.4.3", "pytest>=8.4", "ruff>=0.17"]

[project.scripts]
analysis = "analysis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

[tool.pytest.ini_options]
# gen/python holds the generated protobuf modules. It isn't a package of its
# own, so it goes on the path the same way the Dockerfile's PYTHONPATH does.
pythonpath = ["src", "../../gen/python"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
# Only rules that point at real bugs: syntax errors, undefined names, unused
# imports and variables, and common Python pitfalls. No style rules.
select = ["E9", "F", "B", "PLE"]
