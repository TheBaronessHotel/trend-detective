version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/TheBaronessHotel/trend-detective/gen/go
plugins:
  # Go messages and Connect handlers, for gateway and ingest.
  - remote: buf.build/protocolbuffers/go:v1.36.12
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v2.0.2
    out: gen/go
    opt: paths=source_relative
  # Python messages and type stubs, for preprocess and analysis.
  - remote: buf.build/protocolbuffers/python:v36.2
    out: gen/python
  - remote: buf.build/protocolbuffers/pyi:v36.2
    out: gen/python
  # TypeScript messages and service descriptors for connect-es, for web.
  - remote: buf.build/bufbuild/es:v2.17.0
    out: gen/ts
    opt: target=ts
inputs:
  - directory: proto
