name: stack

on:
  pull_request:
    paths: ["compose.yaml", "deploy/**", "Makefile", ".env.example", "go.mod", "go.sum"]
  push:
    branches: [main]
    paths: ["compose.yaml", "deploy/**", "Makefile", ".env.example", "go.mod", "go.sum"]

permissions:
  contents: read

jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      # Starts NATS, Redis and SeaweedFS and runs bootstrap. Fails if
      # bootstrap can't create the streams and buckets.
      - name: make up
        run: make up

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: make clean
        if: always()
        run: make clean
