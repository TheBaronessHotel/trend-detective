name: stack

on:
  pull_request:
    paths:
      - "compose.yaml"
      - "deploy/**"
      - "internal/**"
      - "services/**"
      - "gen/go/**"
      - "gen/python/**"
      - "Makefile"
      - ".env.example"
      - "go.mod"
      - "go.sum"
  push:
    branches: [main]
    paths:
      - "compose.yaml"
      - "deploy/**"
      - "internal/**"
      - "services/**"
      - "gen/go/**"
      - "gen/python/**"
      - "Makefile"
      - ".env.example"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Go vet
        run: go vet ./...

      - name: Go tests
        run: make test

      - uses: astral-sh/setup-uv@v6

      - name: Preprocess tests
        run: make test-preprocess

      # Starts the infrastructure and the services, and runs bootstrap.
      - name: make up
        run: make up

      # Publishes a real task and checks the result end to end.
      - name: make smoke
        run: make smoke

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: make clean
        if: always()
        run: make clean
