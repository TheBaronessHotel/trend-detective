syntax = "proto3";

// Contracts owned by the preprocess service: the task it receives, the filter
// chain, and the result it reports. data.proto has the documents it writes.
package trenddetective.preprocess.v1;

import "trenddetective/common/v1/common.proto";
import "trenddetective/ingest/v1/ingest.proto";
import "trenddetective/preprocess/v1/data.proto";

// Decode raw files, run the filter chain, and aggregate the region. The
// gateway sends it on tasks.preprocess inside a gateway.v1.Task.
message PreprocessTask {
  // Everything ingest fetched for the job. There is more than one when ingest
  // ran as several tasks.
  repeated trenddetective.ingest.v1.RawDataset raw = 1;
  // Units of the raw values, for files that don't say, for example "K".
  string source_units = 2;
  FilterChain filters = 3;
  Aggregation aggregation = 4;
}

// An ordered list of filter steps.
message FilterChain {
  repeated FilterOp ops = 1;
}

// One step of the filter chain.
message FilterOp {
  oneof op {
    QcRange qc_range = 1;
    Linear linear = 2;
    MonthlyMean monthly_mean = 3;
    Anomaly anomaly = 4;
    Log10 log10 = 5;
    Coarsen coarsen = 6 [deprecated = true];
    GapFillDisplay gap_fill_display = 7;
    ColumnAverage column_average = 8;
  }
}

// Drop values outside [min, max] and record them as failed quality checks.
// For example, negative rain or NDVI above 1.
message QcRange {
  double min = 1;
  double max = 2;
}

// Replace each value with value * scale + offset, for unit conversion. K to
// °C is scale 1 and offset -273.15. kg/m²/s to mm/day is scale 86400.
message Linear {
  double scale = 1;
  double offset = 2;
  // Units after this step, for example "°C".
  string units = 3;
}

// Turn daily or weekly data into monthly means.
message MonthlyMean {
  // A month with fewer valid days than this is missing.
  int32 min_valid_days = 1;
}

// Compute each step's anomaly from the normal for its calendar month.
// Preprocess computes anomalies per pixel first and then averages them.
message Anomaly {
  AnomalyKind kind = 1;
  // Years the normals come from. Unset means the whole record.
  trenddetective.common.v1.YearRange baseline = 2;
  // Share of baseline years a calendar month needs data in for its normal to
  // count. Default 0.7.
  double min_baseline_coverage = 3;
  ClimatologyMethod method = 4;
  // Sine and cosine pairs for CLIMATOLOGY_METHOD_HARMONIC. Default 2.
  int32 harmonics = 5;
}

// Take log10 of each value. Values at or below zero become missing.
// Chlorophyll is roughly log-normal, so it uses this.
message Log10 {}

// Block-average pixels by a factor in each direction.
// Deprecated for gridded data: it averages blocks before the region series
// and the anomaly step, unweighted, and loses why pixels are missing. The
// Grid's square blocks (Aggregation.block_pixels) replace it.
message Coarsen {
  int32 factor = 1;
}

// Collapse data on pressure levels, like AIRS methane, into one value per
// pixel: the average over the air column above it, each level weighted by the
// air it holds. For a mole fraction that's the column-average mole fraction,
// the way column methane and CO2 are usually reported.
//
// Each level's layer runs from halfway to the level below to halfway to the
// level above. The lowest layer ends at the surface pressure and the top one
// at 0 hPa, so layers under the ground weigh nothing. A pixel-step whose
// levels with data hold less than min_coverage of the column's air is
// missing, as a failed quality check.
message ColumnAverage {
  // The surface pressure variable, in hPa: one of the dataset's variables
  // after the first, for example "ascending/Data_Fields/SurfPres_Forecast_A".
  // The source lists it after the measurement.
  string surface_pressure = 1;
  // Share of the column's air, by pressure, that needs a value. Default 0.9.
  double min_coverage = 2;
}

// Fill short gaps by linear interpolation in Series.display_values, for the
// chart only. Statistics never see filled values.
message GapFillDisplay {
  // Longest gap to fill, in time steps. Default 2.
  int32 max_gap = 1;
}

// How preprocess aggregates pixels.
// How preprocess builds the Grid for per-cell analysis, the slider and the
// heatmap. The region series doesn't depend on it: it always uses every valid
// native pixel.
//
// The Grid averages square blocks of k x k native pixels with stride k, never
// a fixed N x N split of the rectangle, whose cells would stretch on a
// non-square one. Partial blocks at the edges keep their real pixels. k is:
//   1. block_pixels, from the job or the catalog's default for the variable;
//   2. else ceil(longer side / subregion_n);
//   3. else 1, native pixels.
// Then k is lowered to leave at least 3 cells on the shorter side, and raised
// to keep both sides within max_grid; max_grid wins. Grid.block_pixels
// records the k used. See Decisions > Region model.
message Aggregation {
  // Cells per side, used to pick k only when block_pixels isn't set. The
  // gateway's default is SUBREGION_N, 8. Zero means native pixels.
  int32 subregion_n = 1;
  // Largest grid side. The gateway sets it from MAX_GRID; a job can lower it
  // but not raise it.
  int32 max_grid = 2;
  // A time step counts only if at least this share of the pixels that ever
  // have data is valid, for the region series and for each Grid cell.
  // Default 0.5.
  double min_valid_fraction = 3;
  // Native pixels per side of a Grid block, 1 for native resolution. Wins
  // over subregion_n. The gateway takes it from the job, else from the
  // catalog, and accepts 1 to 64.
  optional int32 block_pixels = 4;
}

// What preprocess wrote to the prep bucket. It reports this in StageDone.
message PreprocessResult {
  // A Series as protojson.
  trenddetective.common.v1.BlobRef series = 1;
  // The same series as CSV, for download.
  trenddetective.common.v1.BlobRef series_csv = 2;
  // A Grid as protojson. Unset for series-only sources.
  trenddetective.common.v1.BlobRef grid = 3;
  // A CubeHeader for the values, as protojson. Unset for series-only sources.
  trenddetective.common.v1.BlobRef value_cube = 4;
  // A CubeHeader for the anomalies. Unset without an anomaly step.
  trenddetective.common.v1.BlobRef anomaly_cube = 5;
}
